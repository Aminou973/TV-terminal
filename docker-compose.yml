services:
  openterminal:
    build: .
    ports:
      - "8000:8000"          # web app + API: http://localhost:8000
    volumes:
      - ./data:/data         # candles (Parquet) + SQLite users/workspaces
    env_file:
      - path: server/.env    # copy server/.env.example; set OPENTERM_JWT_SECRET
        required: false
    environment:
      # The NT8 AddOn listens on the Windows host's loopback, which a container
      # can't reach — run the server natively on the NT8 box for CME data.
      OPENTERM_NINJA_ENABLED: "false"
    restart: unless-stopped
